run:
  timeout: 5m
  # The workspace has three modules; let the linter follow go.work.
  allow-parallel-runners: true

linters:
  enable:
    - errcheck      # unchecked errors -- the single highest-value Go linter
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose     # leaked HTTP response bodies exhaust connection pools
    - rowserrcheck  # missed sql.Rows.Err() silently truncates result sets
    - contextcheck  # context must be propagated, not replaced with Background()
    - errorlint     # correct errors.Is/As usage over == comparisons
    - misspell
    - revive

linters-settings:
  errcheck:
    check-type-assertions: true
  revive:
    rules:
      - name: exported
        # Exported identifiers in pkg/ are consumed by every service; they need docs.
        arguments: ["checkPrivateReceivers"]

issues:
  exclude-rules:
    # Generated protobuf code is not ours to lint.
    - path: proto/gen/
      linters: [revive, staticcheck, unused, errcheck, misspell]
    # Tests may skip error checks on obvious setup calls.
    - path: _test\.go
      linters: [errcheck, bodyclose]

  exclude-dirs:
    - proto/gen
