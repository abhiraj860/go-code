# TicketFlow local development stack.
#
# Split by profile so you only run what the phase you're on actually needs --
# ElasticSearch and LocalStack are ~2.5GB of images that Phase 1 never touches.
#
#   make up          -> core only: postgres, redis, kafka, mongo   (Phases 1-3)
#   make up-search   -> core + elasticsearch                       (Phase 2+)
#   make up-aws      -> core + localstack                          (Phase 4+)
#   make up-all      -> everything
#   make down        -> stop and remove volumes
#
# Core services carry no `profiles` key, so they start unconditionally.

name: ticketflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: tf-postgres
    environment:
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
      POSTGRES_DB: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tf-redis
    # appendonly keeps seat holds across a restart; maxmemory-policy matters because
    # this instance serves both cache (evictable) and locks (must not be evicted) --
    # Phase 1 splits these into separate logical DBs, see pkg/cache.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: tf-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: containers reach kafka:29092, the host reaches localhost:9092.
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ticketflow-local-cluster
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: tf-elasticsearch
    # Not needed until Phase 2 (search-svc). ~1.3GB image.
    profiles: ["search", "all"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: tf-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ticketflow
      MONGO_INITDB_ROOT_PASSWORD: ticketflow
      MONGO_INITDB_DATABASE: ticketflow
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    image: localstack/localstack:3
    container_name: tf-localstack
    # Not needed until Phase 4 (AWS edge layer). ~1.2GB image.
    profiles: ["aws", "all"]
    environment:
      SERVICES: s3,sqs,sns,dynamodb,lambda,apigateway,iam,cloudwatch,logs,events
      DEBUG: "0"
      LAMBDA_EXECUTOR: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"' || curl -sf http://localhost:4566/_localstack/health | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  redisdata:
  kafkadata:
  esdata:
  mongodata:
  localstackdata:
