syntax = "proto3";

package ticketflow.order.v1;

import "google/protobuf/timestamp.proto";

// Order owns purchases and the transactional outbox that announces them.
//
// It does not own seats. Inventory decides who holds a seat; order records that
// a hold was paid for. Keeping that boundary is what lets inventory stay the
// single authority on the no-double-sell guarantee.

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  // Created, seats still only HELD in inventory. Payment has not settled.
  ORDER_STATUS_PENDING = 1;
  // Paid, and inventory has converted the hold to SOLD.
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_FAILED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message Money {
  int64 amount_minor = 1;
  string currency_code = 2;
}

message Order {
  string id = 1;
  string user_id = 2;
  string event_id = 3;
  // The inventory hold this order pays for.
  string hold_id = 4;
  OrderStatus status = 5;
  repeated string seat_ids = 6;
  Money total = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message PlaceOrderRequest {
  string user_id = 1;
  string event_id = 2;
  string hold_id = 3;
  repeated string seat_ids = 4;
  Money total = 5;
  // Required. A retried checkout must return the original order rather than
  // charging the buyer twice; enforced by a unique constraint, not by
  // application logic.
  string idempotency_key = 6;
}

message PlaceOrderResponse {
  Order order = 1;
  // True when an idempotency key matched an existing order, so no new order
  // was created.
  bool replayed = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

// Settles payment: marks the order PAID and asks inventory to convert the hold
// from HELD to SOLD.
message ConfirmPaymentRequest {
  string order_id = 1;
  // Opaque reference from the payment provider, stored for reconciliation.
  string payment_reference = 2;
}

message ConfirmPaymentResponse {
  Order order = 1;
  repeated string sold_seat_ids = 2;
}

service OrderService {
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (ConfirmPaymentResponse);
}
