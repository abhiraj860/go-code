version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/abhiraj860/ticketflow/proto/gen

plugins:
  # Local plugins (installed by `make tools`) rather than remote ones, so codegen
  # is reproducible offline and pinned to the versions in tools.go.
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
