apiVersion: v1
kind: Namespace
metadata:
  name: arbiter-lite
---
apiVersion: v1
kind: Service
metadata:
  name: arbiter-lite
  namespace: arbiter-lite
spec:
  selector:
    app: arbiter-lite
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: arbiter-lite
  namespace: arbiter-lite
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 60 }
        - setWeight: 50
        - pause: { duration: 60 }
        - setWeight: 100
      trafficRouting:
        nginx:
          stableService: arbiter-lite
          canaryService: arbiter-lite-canary
  selector:
    matchLabels:
      app: arbiter-lite
  template:
    metadata:
      labels:
        app: arbiter-lite
    spec:
      containers:
        - name: arbiter-lite
          image: ghcr.io/abhiraj/arbiter-lite:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
