# Automated rollback gate: if the canary's error rate exceeds 5% during
# the rollout window, Argo Rollouts aborts and reverts traffic to stable
# automatically — no human in the loop. This is what backs the
# "automated rollback" resume claim; the metric below is what you'd
# point Prometheus/Datadog at in a real cluster.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-check
  namespace: arbiter-lite
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 30s
      count: 3
      successCondition: result[0] <= 0.05
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            sum(rate(arbiter_lite_process_errors_total{service="{{args.service-name}}"}[1m]))
            /
            sum(rate(arbiter_lite_tickets_processed_total{service="{{args.service-name}}"}[1m]))
