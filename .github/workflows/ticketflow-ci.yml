name: ticketflow-ci

# Scoped to the ticketflow subtree so unrelated dsa/lld commits don't burn CI minutes.
on:
  push:
    branches: [main]
    paths: ["project/ticketflow/**", ".github/workflows/ticketflow-ci.yml"]
  pull_request:
    paths: ["project/ticketflow/**", ".github/workflows/ticketflow-ci.yml"]

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ticketflow-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  BUF_VERSION: "1.47.2"

jobs:
  proto:
    name: proto (lint, breaking, codegen drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/ticketflow
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking needs history to diff against the main branch.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: project/ticketflow/**/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: cd proto && buf lint

      # The contract gate: a wire-incompatible edit to a released v1 package
      # fails here. Breaking changes must ship as an additive new version.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          cd proto
          buf breaking --against \
            "https://github.com/${{ github.repository }}.git#branch=main,subdir=project/ticketflow/proto"

      - name: install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      # Generated code is committed, so a stale checkout is a real bug: someone
      # edited a .proto and forgot `make proto`. Regenerate and diff.
      - name: verify generated code is current
        run: |
          make proto
          if ! git diff --exit-code -- proto/gen; then
            echo "::error::proto/gen is stale -- run 'make proto' and commit the result"
            exit 1
          fi

  go:
    name: go (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/ticketflow

    # Real dependencies, because the tests that matter most here are integration
    # tests. Without these the suite would skip them and report a green build --
    # confidence without coverage. TF_REQUIRE_INTEGRATION below turns any such
    # skip into a failure, so a broken service definition cannot hide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticketflow
          POSTGRES_PASSWORD: ticketflow
          POSTGRES_DB: ticketflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketflow -d ticketflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      kafka:
        image: apache/kafka:3.9.0
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          # Unlike the compose stack, CI lets Kafka create topics on demand:
          # there is no `make topics` step before the tests run.
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: ticketflow-ci-cluster
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 20s

      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: ticketflow
          MONGO_INITDB_ROOT_PASSWORD: ticketflow
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: project/ticketflow/**/go.sum

      - name: build
        run: make build

      - name: vet
        run: |
          go vet ./...
          cd pkg && go vet ./...

      - name: test
        env:
          # Any test that would skip for a missing dependency fails instead.
          # A skipped test is indistinguishable from a passing one in the CI
          # summary, so without this a misconfigured service container yields
          # a green build in which the no-double-sell test never ran.
          TF_REQUIRE_INTEGRATION: "1"
        run: make test TESTFLAGS="-race -count=1"

      # Belt and braces: assert the concurrency test that the whole project
      # exists to guarantee actually executed, rather than trusting the exit code.
      - name: assert the no-double-sell test ran
        env:
          TF_REQUIRE_INTEGRATION: "1"
        run: |
          out=$(go test -count=1 -run TestConcurrentHoldsOnOneSeatProduceExactlyOneWinner \
                  -v ./services/inventory-svc/internal/repo/ 2>&1)
          echo "$out"
          if ! grep -q -- "--- PASS: TestConcurrentHoldsOnOneSeatProduceExactlyOneWinner" <<<"$out"; then
            echo "::error::the no-double-sell concurrency test did not run to a PASS"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: project/ticketflow/**/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: project/ticketflow
